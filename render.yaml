# One-click deploy on Render (free plan): New > Blueprint > pick this repo.
services:
  - type: web
    name: scamshield-my
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
